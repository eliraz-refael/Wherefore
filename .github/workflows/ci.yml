name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            companion/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm -C companion install --frozen-lockfile

      # Product rewrite (packages/*)
      - name: Check unstable Effect imports
        run: pnpm check:imports
      - name: Typecheck packages
        run: pnpm typecheck:packages
      - name: Test packages
        run: pnpm test:packages
      - name: Build extension
        run: pnpm -C packages/extension build

      # POC (root extension + companion/), kept green until it is removed after M1
      - name: Typecheck POC
        run: |
          pnpm typecheck
          pnpm -C companion typecheck
      - name: Build POC
        run: |
          pnpm build
          pnpm -C companion build
