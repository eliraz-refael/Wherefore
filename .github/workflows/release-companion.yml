# Releases the companion (packages/companion) as @eliraz-refael/wherefore: checks and builds it,
# packs the tarball, attaches it to a GitHub Release for the tag (installable without npm:
# `npm install -g <the release's .tgz URL>`), then publishes the same tarball to npm.
#
# To release: bump the version in packages/companion/package.json and src/version.ts, merge, then
# push a tag `companion-v<that version>`. A manual run (Actions → Release companion → Run workflow)
# is a dry run by default: everything but the release and the publish. To release from a manual
# run, pick the tag as the ref and untick "dry run". One-time setup: packages/companion/README.md,
# "Releasing".
name: Release companion

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check, build and pack only (no GitHub Release, no npm publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release the companion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          # Writes an .npmrc that authenticates `npm publish` with NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org

      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./packages/companion/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "companion-v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/companion/package.json ($version): expected companion-v$version"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::A release runs on a companion-v* tag; this run is on $GITHUB_REF_NAME. Pick the tag, or keep dry run."
            exit 1
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same checks as CI, for the companion and what it bundles (core).
      - name: Check unstable Effect imports
        run: pnpm check:imports
      - name: Typecheck
        run: pnpm -r --filter "{./packages/companion}..." typecheck
      - name: Test
        run: pnpm -r --filter "{./packages/companion}..." test
      - name: Build companion and run its smoke test
        run: |
          pnpm -C packages/companion build
          pnpm -C packages/companion smoke

      # pnpm pack, not npm pack: it rewrites the workspace:* devDependency.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm -C packages/companion pack --pack-destination "$RUNNER_TEMP/pack"
          tgz=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "Tarball: $tgz ($(du -h "$tgz" | cut -f1))"
          tar -tzf "$tgz" | sort > "$RUNNER_TEMP/files.txt"
          printf '%s\n' package/LICENSE package/README.md package/dist/cli.js package/package.json > "$RUNNER_TEMP/expected.txt"
          if ! diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/files.txt"; then
            echo "::error::The tarball holds other files than LICENSE, README.md, dist/cli.js and package.json"
            exit 1
          fi

      - name: Install the tarball and run it
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$TGZ"
          "$RUNNER_TEMP/prefix/bin/wherefore" --version
          "$RUNNER_TEMP/prefix/bin/wherefore" --help
          if [ -d "$RUNNER_TEMP/prefix/lib/node_modules/@eliraz-refael/wherefore/node_modules" ]; then
            echo "::error::Installing the tarball pulled dependencies; everything the bundle inlines must be a devDependency"
            exit 1
          fi

      - name: Create the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Idempotent, so a rerun after a failed publish only replaces the tarball.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TGZ" --clobber
          else
            flags=""
            if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
            name=$(basename "$TGZ")
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
            gh release create "$GITHUB_REF_NAME" "$TGZ" --verify-tag $flags \
              --title "Wherefore companion $VERSION" \
              --notes "Install with \`npx @eliraz-refael/wherefore install\`, or without npm's registry: \`npm install -g $url\`, then \`wherefore install\`. Requires Node 22 or newer. See [the companion's README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/packages/companion/README.md)."
          fi

      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if npm view "@eliraz-refael/wherefore@$VERSION" version > /dev/null 2>&1; then
            echo "@eliraz-refael/wherefore@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          npm publish "$TGZ" --provenance --access public --tag "$tag"
