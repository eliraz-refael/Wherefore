# Releases the companion (packages/companion) as @eliraz-refael/wherefore: checks and builds it,
# packs the tarball, attaches it to a GitHub Release for the tag (installable without npm:
# `npm install -g <the release's .tgz URL>`), then publishes the same tarball to npm.
#
# To release: bump the version in packages/companion/package.json and src/version.ts, merge, then
# push a tag `companion-v<that version>`. A manual run (Actions → Release companion → Run workflow)
# is a dry run by default: everything but the release and the publish. To release from a manual
# run, pick the tag as the ref and untick "dry run". One-time setup: packages/companion/README.md,
# "Releasing".
#
# npm auth: trusted publishing (GitHub OIDC, no token) once it is configured for the package on
# npmjs.com. Until then (npm allows it only on a package that exists), the NPM_TOKEN secret, for the
# first publish; delete the secret afterwards.
name: Release companion

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check, build and pack only (no GitHub Release, no npm publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-companion-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # Checks, builds and packs with read-only permissions: `pnpm install` runs dependencies' scripts
  # here, so this job holds no OIDC token (which npm's trusted publishing would accept) and no write
  # access. The publish job below runs none of the repository's dependencies.
  build:
    name: Build and pack the companion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tgz: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./packages/companion/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "companion-v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/companion/package.json ($version): expected companion-v$version"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::A release runs on a companion-v* tag; this run is on $GITHUB_REF_NAME. Pick the tag, or keep dry run."
            exit 1
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same checks as CI, for the companion and what it bundles (core).
      - name: Check unstable Effect imports
        run: pnpm check:imports
      - name: Typecheck
        run: pnpm -r --filter "{./packages/companion}..." typecheck
      - name: Test
        run: pnpm -r --filter "{./packages/companion}..." test
      - name: Build companion and run its smoke test
        run: |
          pnpm -C packages/companion build
          pnpm -C packages/companion smoke

      # pnpm pack, not npm pack: it rewrites the workspace:* devDependency.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm -C packages/companion pack --pack-destination "$RUNNER_TEMP/pack"
          tgz=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$tgz")" >> "$GITHUB_OUTPUT"
          echo "Tarball: $tgz ($(du -h "$tgz" | cut -f1))"
          tar -tzf "$tgz" | sort > "$RUNNER_TEMP/files.txt"
          printf '%s\n' package/LICENSE package/README.md package/dist/cli.js package/package.json > "$RUNNER_TEMP/expected.txt"
          if ! diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/files.txt"; then
            echo "::error::The tarball holds other files than LICENSE, README.md, dist/cli.js and package.json"
            exit 1
          fi
          # Everything the bundle needs is inlined: the published manifest installs nothing.
          tar -xzOf "$tgz" package/package.json | node -e '
            const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const extra = ["dependencies", "optionalDependencies", "peerDependencies", "bundleDependencies", "bundledDependencies"]
              .filter((field) => pkg[field] !== undefined && Object.keys(pkg[field]).length > 0)
            if (extra.length > 0) { console.error("::error::The packed package.json declares " + extra.join(", ")); process.exit(1) }
          '

      - name: Install the tarball and run it
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$TGZ"
          "$RUNNER_TEMP/prefix/bin/wherefore" --version
          "$RUNNER_TEMP/prefix/bin/wherefore" --help
          if [ -d "$RUNNER_TEMP/prefix/lib/node_modules/@eliraz-refael/wherefore/node_modules" ]; then
            echo "::error::Installing the tarball pulled dependencies; everything the bundle inlines must be a devDependency"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-tarball
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release the companion
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-tarball
          path: ${{ runner.temp }}/pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No registry-url: it would write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` for every
          # npm command in the job. The publish step writes one only when it uses NPM_TOKEN.

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: |
          npm install -g npm@11.20.0
          npm --version

      - name: Create the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ runner.temp }}/pack/${{ needs.build.outputs.tgz }}
        run: |
          # Safe to rerun (e.g. after a failed publish): a release that has a tarball keeps it, since
          # people may have installed from its URL; one without gets this one.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            tarballs=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | select(.name | endswith(".tgz"))] | length')
            if [ "$tarballs" -gt 0 ]; then
              echo "Release $GITHUB_REF_NAME has a tarball already; it is never replaced."
            else
              gh release upload "$GITHUB_REF_NAME" "$TGZ"
            fi
          else
            flags=""
            if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
            name=$(basename "$TGZ")
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
            gh release create "$GITHUB_REF_NAME" "$TGZ" --verify-tag $flags \
              --title "Wherefore companion $VERSION" \
              --notes "Install with \`npx @eliraz-refael/wherefore install\`, or without npm's registry: \`npm install -g $url\`, then \`wherefore install\`. Requires Node 22 or newer. See [the companion's README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/packages/companion/README.md)."
          fi

      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ runner.temp }}/pack/${{ needs.build.outputs.tgz }}
        run: |
          if npm view "@eliraz-refael/wherefore@$VERSION" version > /dev/null 2>&1; then
            echo "@eliraz-refael/wherefore@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          if [ -n "$NPM_TOKEN" ]; then
            # The first publish, before a trusted publisher can be configured. npm expands
            # ${NPM_TOKEN} itself when it reads this file, so the token is never written to disk.
            echo "npm auth: the NPM_TOKEN secret (npm still prefers trusted publishing if it is configured)."
            # shellcheck disable=SC2016
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$RUNNER_TEMP/publish.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          else
            echo "npm auth: trusted publishing (GitHub OIDC), no token."
          fi
          npm publish "$TGZ" --provenance --access public --tag "$tag"
